<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5e81ac">
    <title>PuyoAI ベンチマークZIP保存</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1f2630;
            color: #eee;
            padding: 24px;
            box-sizing: border-box;
        }
        main {
            width: min(520px, 100%);
            padding: 24px;
            box-sizing: border-box;
            border-radius: 14px;
            background: #2b3440;
            box-shadow: 0 10px 30px rgba(0,0,0,.28);
        }
        h1 { font-size: 1.25rem; margin: 0 0 12px; }
        p { line-height: 1.55; color: #bbb; }
        #export-status[data-state="error"] { color: #ff9b9b; }
        #export-actions { display: grid; gap: 10px; margin-top: 18px; }
        a, button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 16px;
            border: 0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        #save-zip-link { background: #457b9d; color: white; }
        #share-zip-button { background: #2a9d8f; color: white; }
        .note { font-size: .84rem; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>PuyoAI ベンチマークログ</h1>
        <p id="export-status">ZIPを準備しています…</p>
        <div id="export-actions" hidden>
            <a id="save-zip-link" href="#" hidden>ZIPを保存</a>
            <button id="share-zip-button" type="button" hidden>共有 / ファイルに保存</button>
        </div>
        <p id="export-error" class="note" hidden>
            保存できない場合は、上の「ZIPを保存」をタップしてください。iPhone/iPadでは共有ボタンから「ファイルに保存」を選べます。
        </p>
        <p class="note">この画面を開いたままにしておくと、保存ボタンから同じZIPを何度でも保存できます。</p>
    </main>
    <script type="module" src="./benchmark-export.js"></script>
</body>
</html>
